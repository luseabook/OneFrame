name: oneframe

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@postgres:5432/app
  REDIS_URL: redis://redis:6379
  JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-change-me}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
  # 本地 compose 为 HTTP 部署，Cookie 不能带 Secure（否则浏览器不保存 → 刷新掉登录）。
  # 生产 HTTPS 部署请设为 true（.env.production.example 已注明）。
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
  STORAGE_DRIVER: s3
  STORAGE_S3_BUCKET: ${S3_BUCKET:-app-results}
  STORAGE_S3_REGION: ${S3_REGION:-us-east-1}
  STORAGE_S3_ENDPOINT: http://minio:9000
  STORAGE_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  STORAGE_S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
  STORAGE_S3_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin}
  STORAGE_S3_FORCE_PATH_STYLE: "true"
  # LLM 步骤（大纲/角色/剧本/分镜）：real 走 DeepSeek，mock 为确定性假文案。
  # 显式透传而非隐式默认：NODE_ENV=production 下若设 LLM_MODE=real 而缺 DEEPSEEK_API_KEY，
  # api 启动守卫会直接 fail fast（apps/api/src/config/env.ts collectLlmProblems）。
  LLM_MODE: ${LLM_MODE:-mock}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin}; do echo 'waiting minio'; sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET:-app-results};
      echo 'minio bucket ready';
      "
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "./node_modules/.bin/drizzle-kit migrate && ./node_modules/.bin/tsx src/db/seed.ts"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/v1/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    environment:
      <<: *app-env
      AI_LABEL_ENABLED: ${AI_LABEL_ENABLED:-true}
      AI_LABEL_TEXT: ${AI_LABEL_TEXT:-AI生成}
      # 不设默认值：worker 启动守卫要求 ADAPTER_MODE=real（禁止 mock 生成），
      # 给它一个 mock 默认值只会让 worker 以"必须为 real"的报错启动失败，误导排查。
      # 部署时必须在 .env 里显式设置 ADAPTER_MODE=real 及至少一种真实供应商凭据。
      ADAPTER_MODE: ${ADAPTER_MODE:-}
      HTTP_VIDEO_BASE_URL: ${HTTP_VIDEO_BASE_URL:-}
      HTTP_VIDEO_API_KEY: ${HTTP_VIDEO_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # SSR 内部代理 /v1 的目标（容器内用服务名）
        NUXT_API_PROXY: http://api:3000
    environment:
      NODE_ENV: production
      PORT: "3001"
      NITRO_PORT: "3001"
      NUXT_API_PROXY: http://api:3000
    expose:
      - "3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
