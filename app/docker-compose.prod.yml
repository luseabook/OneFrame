name: oneframe

x-app-env: &app-env
  NODE_ENV: production
  DATABASE_URL: postgres://app:${POSTGRES_PASSWORD:-app}@postgres:5432/app
  REDIS_URL: redis://redis:6379
  # ── 密钥类变量（PR-01/PR-02/PR-05）──────────────────────────────────────
  # 一律用 `${VAR:?}` 强制必填：**不给生产密钥留默认值**。
  # 缺一个变量时 `docker compose up` 会在解析阶段直接报错（比 api 容器 CrashLoop 好排查得多）。
  # 这些值同时也可从 `env_file: ./.env` 读入；写在这里是为了"缺了就报错"的强约束。
  JWT_SECRET: "${JWT_SECRET:?JWT_SECRET is required (see .env.production.example)}"
  # 管理端 token 专用密钥（PR-05）：生产必填，且不得与 JWT_SECRET 相同（用户域密钥泄露不得导致 admin 可伪造）
  ADMIN_JWT_SECRET: "${ADMIN_JWT_SECRET:?ADMIN_JWT_SECRET is required (see .env.production.example)}"
  # PIPL 加密/散列密钥（PR-01）：缺失时 env.ts 生产守卫会拒绝启动
  PHONE_HMAC_PEPPER: "${PHONE_HMAC_PEPPER:?PHONE_HMAC_PEPPER is required}"
  PHONE_ENC_KEY: "${PHONE_ENC_KEY:?PHONE_ENC_KEY is required}"
  STORAGE_SIGN_SECRET: "${STORAGE_SIGN_SECRET:?STORAGE_SIGN_SECRET is required}"
  # 支付开关必须显式声明（PR-02）：缺省会让生产默认落在 mock 渠道上
  PAYMENT_LIVE: "${PAYMENT_LIVE:?PAYMENT_LIVE is required (true|false)}"
  ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin12345}
  # 本地 HTTP 部署与生产 HTTPS 的差异必须由部署者显式声明（P1-11）：
  # 原来默认 false，照抄 prod compose 上 HTTPS 会得到"登录后刷新即掉线"，
  # 反过来在内网 HTTP 上强行 true 则根本存不下 Cookie。缺省不再替人决定。
  COOKIE_SECURE: "${COOKIE_SECURE:?COOKIE_SECURE is required (true for HTTPS, false for intranet HTTP)}"
  # `/v1/metrics` 抓取令牌（P1-12）：指标含任务与资金异常，不能匿名可读。
  # 缺失时 api 启动守卫也会拒绝启动（env.ts），这里提前在 compose 解析阶段报错。
  METRICS_TOKEN: "${METRICS_TOKEN:?METRICS_TOKEN is required (see .env.production.example)}"
  STORAGE_DRIVER: s3
  STORAGE_S3_BUCKET: ${S3_BUCKET:-app-results}
  STORAGE_S3_REGION: ${S3_REGION:-us-east-1}
  STORAGE_S3_ENDPOINT: http://minio:9000
  STORAGE_S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:9000}
  # minioadmin 是公开已知口令（PR-05）：不再作为默认值，必须显式配置
  STORAGE_S3_ACCESS_KEY_ID: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required (minioadmin is a public known password)}"
  STORAGE_S3_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:?S3_SECRET_KEY is required (minioadmin is a public known password)}"
  STORAGE_S3_FORCE_PATH_STYLE: "true"
  # LLM 步骤（大纲/角色/剧本/分镜）：real 走 DeepSeek，mock 为确定性假文案。
  # 显式透传而非隐式默认：NODE_ENV=production 下若设 LLM_MODE=real 而缺 DEEPSEEK_API_KEY，
  # api 启动守卫会直接 fail fast（apps/api/src/config/env.ts collectLlmProblems）。
  LLM_MODE: ${LLM_MODE:-mock}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-app}
      POSTGRES_DB: app
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: "${S3_ACCESS_KEY:?S3_ACCESS_KEY is required (minioadmin is a public known password)}"
      MINIO_ROOT_PASSWORD: "${S3_SECRET_KEY:?S3_SECRET_KEY is required (minioadmin is a public known password)}"
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required} ${S3_SECRET_KEY:?S3_SECRET_KEY is required}; do echo 'waiting minio'; sleep 2; done;
      mc mb --ignore-existing local/${S3_BUCKET:-app-results};
      echo 'minio bucket ready';
      "
    restart: "no"

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "./node_modules/.bin/drizzle-kit migrate && ./node_modules/.bin/tsx src/db/seed.ts"]
    environment: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    # PR-01：此前容器只拿到 environment 里显式列出的变量，PHONE_* 等从未进入容器
    # → env.ts 生产守卫直接抛错 → api CrashLoop。env_file 让 .env 全量进容器，
    # environment 仍覆盖同名键（必填校验留在上面那段 x-app-env 里）。
    env_file:
      - ./.env
    environment: *app-env
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    expose:
      - "3000"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3000/v1/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    env_file:
      - ./.env
    environment:
      <<: *app-env
      AI_LABEL_ENABLED: ${AI_LABEL_ENABLED:-true}
      AI_LABEL_TEXT: ${AI_LABEL_TEXT:-AI生成}
      # 不设默认值：worker 启动守卫要求 ADAPTER_MODE=real（禁止 mock 生成），
      # 给它一个 mock 默认值只会让 worker 以"必须为 real"的报错启动失败，误导排查。
      # 部署时必须在 .env 里显式设置 ADAPTER_MODE=real 及至少一种真实供应商凭据。
      ADAPTER_MODE: ${ADAPTER_MODE:-}
      HTTP_VIDEO_BASE_URL: ${HTTP_VIDEO_BASE_URL:-}
      HTTP_VIDEO_API_KEY: ${HTTP_VIDEO_API_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # SSR 内部代理 /v1 的目标（容器内用服务名）
        NUXT_API_PROXY: http://api:3000
    environment:
      NODE_ENV: production
      PORT: "3001"
      NITRO_PORT: "3001"
      NUXT_API_PROXY: http://api:3000
    expose:
      - "3001"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    # TLS 终止在这里（第 107 批）：80 只做 ACME 校验 + 308 跳转，业务走 443。
    # 若改用外层 LB/CDN 终止 TLS，**不能**让它反代到本容器的 80 —— 80 会 308 回 https，
    # 形成「LB→80→https→LB」循环；那种部署要把模板里的 80 跳转 server 去掉，或让 LB 直连 443。
    ports:
      - "80:80"
      - "443:443"
    environment:
      # 模板变量：真实域名（例 app.example.com）。证书 CN/SAN 必须匹配这个值。
      # 缺失即 compose 解析阶段报错，不会带着 `server_name ${TLS_SERVER_NAME}` 起容器。
      TLS_SERVER_NAME: ${TLS_SERVER_NAME:?TLS_SERVER_NAME is required (e.g. app.example.com)}
    volumes:
      # nginx 官方镜像 entrypoint 会把 /etc/nginx/templates/*.template 用 envsubst 渲染到 conf.d
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      # 证书由宿主机放置/续期，容器**只读**挂载。私钥绝不进仓库、不进镜像（见 .gitignore）。
      - ${TLS_CERT_DIR:-./deploy/certs}:/etc/nginx/certs:ro
      # ACME HTTP-01 校验目录：certbot --webroot 写入宿主机同名目录。
      - ${TLS_ACME_WEBROOT:-./deploy/acme-webroot}:/var/www/certbot:ro
    healthcheck:
      # wget 在 alpine 里自带；自签证书会校验失败，所以显式 --no-check-certificate（仅本机回环探活）
      test:
        [
          "CMD-SHELL",
          "wget -q --no-check-certificate -O /dev/null https://127.0.0.1/nginx-health || exit 1",
        ]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 5s
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
