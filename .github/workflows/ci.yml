name: ci
on:
  push:
    branches: [main]
  pull_request:

env:
  DATABASE_URL: postgres://app:app@localhost:5432/app
  REDIS_URL: redis://localhost:6379
  NODE_ENV: test
  JWT_SECRET: ci-test-jwt-secret-0123456789abcdef

defaults:
  run:
    working-directory: app

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # seed 通过 @app/db 导入 schema，需先构建共享包（CI 为干净检出，无 dist）
      - run: pnpm --filter @app/shared build
      - run: pnpm --filter @app/db build
      - run: pnpm --filter @app/api db:migrate
      - run: pnpm --filter @app/api db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
